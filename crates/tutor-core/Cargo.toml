[package]
name = "erg-tutor-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
erg-proto = { path = "../proto" }
erg-net = { path = "../net" }
erg-privcmd = { path = "../privcmd" }
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde.workspace = true
serde_json = "1"
uuid.workspace = true
tracing = "0.1"
jpeg-decoder = "0.3"

[target.'cfg(windows)'.dependencies]
erg-mp4 = { path = "../mp4" }

[dev-dependencies]
jpeg-encoder = "0.6"
erg-sim = { path = "../sim" }
erg-student-core = { path = "../student-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
