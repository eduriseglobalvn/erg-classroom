[package]
name = "erg-sysops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
erg-proto = { path = "../proto" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Ole",
  "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader", "Win32_System_Threading",
] }
