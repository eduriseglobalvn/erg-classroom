[package]
name = "erg-student-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde.workspace = true
erg-proto = { path = "../../../crates/proto" }
erg-show = { path = "../../../crates/show" }
erg-student-core = { path = "../../../crates/student-core" }
erg-policy = { path = "../../../crates/policy" }
erg-assess = { path = "../../../crates/assess" }

[target.'cfg(windows)'.dependencies]
erg-capture = { path = "../../../crates/capture" }
erg-sysops = { path = "../../../crates/sysops" }
erg-authpipe = { path = "../../../crates/authpipe" }
erg-broadcast = { path = "../../../crates/broadcast" }
